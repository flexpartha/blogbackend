server.port=8012
server.servlet.context-path=/dempproject/blogger
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/userblog_DB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true&serverTimezone=UTC&allowLoadLocal=true&allowUrlInLocalInfile=true&allowLoadLocalInfile=true
spring.datasource.username=PC90JC
spring.datasource.password=Admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=BlogAppSecretKey2024SuperSecureKeyForJWTSigning
app.jwt.expiration=86400000

# Multipart (image upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.blog=DEBUG

# Ensure data.sql runs after JPA schema generation so inserts apply to created tables
spring.jpa.defer-datasource-initialization=true
# Always enable SQL initialization (runs data.sql)
#spring.sql.init.mode=always
spring.sql.init.mode=never
