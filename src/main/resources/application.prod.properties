spring.config.activate.on-profile=prod

server.port=${PORT:8012}
server.servlet.context-path=/dempproject/blogger

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

# Multipart (image upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.blog=DEBUG

# Ensure data.sql runs after JPA schema generation so inserts apply to created tables
spring.jpa.defer-datasource-initialization=true
# Always enable SQL initialization (runs data.sql)
#spring.sql.init.mode=always
spring.sql.init.mode=never
